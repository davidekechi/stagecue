name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stagecue
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: stagecue_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stagecue" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: stagecue_test
      DB_USERNAME: stagecue
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, intl, mbstring, pcntl
          coverage: pcov
      - name: Install composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Pint
        run: vendor/bin/pint --test
      - name: Pest
        run: vendor/bin/pest --coverage --min=80

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint (eslint + vue-tsc)
        run: npm run lint
      - name: Unit & component tests (with coverage gates)
        run: npm run test:coverage
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stagecue
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: stagecue
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stagecue" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: stagecue
      DB_USERNAME: stagecue
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, intl, mbstring, pcntl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Playwright boots `php artisan serve` and `php artisan reverb:start` itself (playwright.config.ts).
      - name: Playwright (Chromium)
        run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
